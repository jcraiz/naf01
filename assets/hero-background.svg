<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Navy to dark navy gradient -->
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001A33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gold accent gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F0A500;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#F0A500;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#F0A500;stop-opacity:0.15" />
    </linearGradient>
    
    <!-- Subtle pattern for technical feel -->
    <pattern id="techPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <g stroke="#F0A500" stroke-width="0.5" fill="none" opacity="0.08">
        <!-- Grid lines -->
        <path d="M0,30 L60,30 M30,0 L30,60"/>
        <!-- Diamond shape representing technical precision -->
        <path d="M30,5 L55,30 L30,55 L5,30 Z"/>
        <!-- Small circle for connectivity -->
        <circle cx="30" cy="30" r="4"/>
      </g>
    </pattern>
    
    <!-- Floating elements for depth -->
    <g id="floatingElements">
      <circle cx="200" cy="150" r="3" fill="#F0A500" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="400" cy="300" r="2" fill="#F0A500" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1700" cy="200" r="4" fill="#F0A500" opacity="0.25">
        <animate attributeName="opacity" values="0.25;0.55;0.25" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1500" cy="800" r="3" fill="#F0A500" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </defs>
  
  <!-- Base gradient background -->
  <rect width="1920" height="1080" fill="url(#navyGradient)"/>
  
  <!-- Technical pattern overlay -->
  <rect width="1920" height="1080" fill="url(#techPattern)"/>
  
  <!-- Gold accent stripes -->
  <rect x="0" y="0" width="1920" height="2" fill="url(#goldGradient)"/>
  <rect x="0" y="1078" width="1920" height="2" fill="url(#goldGradient)"/>
  
  <!-- Decorative corner elements representing education/technical fields -->
  <g opacity="0.12" stroke="#F0A500" stroke-width="1" fill="none">
    <!-- Top left: graduation cap abstract -->
    <path d="M50,50 L100,75 L50,100 L0,75 Z M50,75 L50,120"/>
    <!-- Top right: computer/tech abstract -->
    <rect x="1820" y="50" width="60" height="45" rx="3"/>
    <rect x="1835" y="95" width="30" height="8" rx="2"/>
    <!-- Bottom left: documents/admin abstract -->
    <rect x="30" y="980" width="40" height="55" rx="2"/>
    <rect x="75" y="990" width="35" height="45" rx="2"/>
    <!-- Bottom right: logistics/travel abstract -->
    <path d="M1850,950 L1890,970 L1890,1010 L1850,1030 Z" fill="none"/>
    <circle cx="1870" cy="990" r="8"/>
  </g>
  
  <!-- Floating animated elements -->
  <use href="#floatingElements"/>
  
  <!-- Subtle radial highlight for depth -->
  <radialGradient id="radialHighlight" cx="50%" cy="50%" r="70%">
    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.03"/>
    <stop offset="100%" style="stop-color:#001A33;stop-opacity:0"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#radialHighlight)"/>
</svg>
